<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WildAIPrint Frontend</title>
  <!-- Link to CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Custom favicon from assets folder -->
  <link rel="icon" type="image/png" href="assets/logo_favicon.png">
</head>

<body>
    <header>
        <img src="assets/logo.png" alt="Logo WildAIPrint" width="200">

        <p>Take a photo or choose from gallery to identify animal tracks</p>
        <button>Identify Track</button>
    </div>




    <!-- Link to JS -->
    <script src="script.js"></script>

</html>
