image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2

stages:
  - test
  - build
  - push
before_script:
  - apt update && apt install -y git git-lfs python3-pip
  - git lfs install
  - git lfs pull
  - pip uninstall -y keras tensorflow || true
  - pip install keras==3.11.3 tensorflow>=2.13
  - python -c "import keras, tensorflow; print('Keras:', keras.__version__, 'TF:', tensorflow.__version__)"
  - pip install -r api/requirements.txt
# API Flask Tests
test_api:
  stage: test
  image: python:3.11
  script:
    - python3 -m api.test_api
  only:
    - main

# Build Flask image 
build_api:
  stage: build
  image: debian:bullseye-slim
  before_script:
    - apt update && apt install -y git git-lfs python3-pip
  script:
    - docker build -t $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA ./api
  only:
    - main

# Push Flask image 
push_api:
  stage: push
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA
  only:
    - main

# Build Frontend image 
build_front:
  stage: build
  image: debian:bullseye-slim
  before_script:
    - apt update && apt install -y git git-lfs
    - git lfs install
    - git lfs pull
  script:
    - docker build -t $CI_REGISTRY_IMAGE/front:$CI_COMMIT_SHORT_SHA ./front
  only:
    - main

# Push Frontend image 
push_front:
  stage: push
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/front:$CI_COMMIT_SHORT_SHA
  only:
    - main
