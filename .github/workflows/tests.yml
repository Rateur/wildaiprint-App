name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      # model.keras stays a Git LFS pointer here (213 MB): test_predict_real_model is skipped, the GitLab job runs it
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - run: python -m pytest api/test_api.py -v
